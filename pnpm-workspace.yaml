# nocetta is a single-package repo; this file records pnpm's dependency-build
# policy. We use web-tree-sitter's prebuilt WASM, so the tree-sitter grammars
# need NO native build (their addons are never loaded). Only esbuild (vitest's
# transpiler) legitimately builds.
onlyBuiltDependencies:
  - esbuild
allowBuilds:
  esbuild: true
  tree-sitter-typescript: false
  tree-sitter-javascript: false
